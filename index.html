<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bike Lights</title>
<style>
:root{
  --bg:#f2f4f8;--card:#ffffff;--fg:#141922;--muted:#5d6676;--btn:#e4e8ef;--acc:#1e7fe0;--onacc:#ffffff;--ok:#1fa85a;--err:#c93434;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0e1116;--card:#1a1f29;--fg:#e8ecf2;--muted:#8b95a7;--btn:#2a3140;--acc:#3ea6ff;--onacc:#00111f;--ok:#2ecc71;--err:#ff7a7a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e1116;--card:#1a1f29;--fg:#e8ecf2;--muted:#8b95a7;--btn:#2a3140;--acc:#3ea6ff;--onacc:#00111f;--ok:#2ecc71;--err:#ff7a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:520px;padding:14px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:12px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px}.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{background:var(--btn);color:var(--fg);border:0;border-radius:10px;padding:12px 6px;font-size:15px;font-family:inherit}
button.on{background:var(--acc);color:var(--onacc);font-weight:700}
#pwr{flex:none;width:76px;padding:8px}
#pwr.on{background:var(--ok);color:#fff}
#conn{width:100%;font-weight:700}
input[type=color]{width:100%;height:56px;border:0;border-radius:10px;background:none;padding:0}
input[type=range]{width:100%;height:34px}
.sw{display:flex;gap:6px;margin-top:8px}
.sw span{flex:1;height:30px;border-radius:8px;border:2px solid rgba(0,0,0,.2)}
label{display:block;margin:8px 0 0;font-size:14px}
#status{margin-top:8px;font-size:13px;color:var(--muted)}
#status.err{color:var(--err)}
#ctl{display:none}
#batt{font-size:15px;font-weight:700}
#updmsg{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.4}
#updbtn,#wsave,#wclear{width:100%;margin-top:8px}
#upd input{width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;background:var(--btn);color:var(--fg);font-size:16px;font-family:inherit}
#wsaved{font-size:13px;color:var(--muted)}
#imumsg,#rate,#peak{margin-top:6px;font-size:13px;color:var(--muted)}
#auto,#phone,#flip,#swf,#swb,#peakbtn,#cal{width:100%;margin-top:8px}
#laymsg{margin-top:6px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<h1><span>Bike Lights</span><span id="batt"></span><button id="pwr">ON</button></h1>

<div class="card">
  <button id="conn" class="on">Connect to BikeLights</button>
  <div id="status">Not connected</div>
</div>

<div id="ctl">
  <div class="card"><h2>Which light?</h2>
    <div class="row" id="tabs"><button data-t="0">Front</button><button data-t="1">Back</button><button data-t="2" class="on">Both</button></div>
  </div>

  <div class="card"><h2>Colour</h2>
    <input type="color" id="col" value="#ffffff">
    <div class="sw" id="sw"></div>
    <label>Brightness</label><input type="range" id="bri" min="5" max="255">
    <label>Speed</label><input type="range" id="spd" min="1" max="100">
  </div>

  <div class="card"><h2>Mode</h2><div class="grid" id="modes"></div></div>

  <div class="card"><h2>Indicators (stop after 20 s)</h2>
    <div class="row"><button id="sg1">&#9664; Left</button><button id="sg3">Hazard</button><button id="sg2">Right &#9654;</button></div>
  </div>

  <div class="card" id="layout"><h2>Indicator layout</h2>
    <button id="swf">Front: top row = LEFT</button>
    <button id="swb">Back: left column = LEFT</button>
    <div id="laymsg">Tap Left or Right above to test, and tap these to switch sides.</div>
  </div>

  <div class="card"><h2>Auto indicators</h2>
    <button id="phone">Detect turns with this phone: OFF</button>
    <button id="cal" style="display:none">Recalibrate (keep the bike upright and still)</button>
    <div id="rate"></div>
    <div id="peak"></div>
    <label>Sensitivity</label><input type="range" id="sens" min="1" max="100">
    <button id="flip">Left/right swapped: NO</button>
    <button id="peakbtn">Show last turn details: OFF</button>
    <button id="auto">Wired turn sensor: OFF</button>
    <div id="imumsg"></div>
  </div>

  <div class="card" id="upd"><h2>Update firmware</h2>
    <div id="wsaved"></div>
    <input id="wssid" placeholder="Home WiFi name" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <input id="wpass" type="password" placeholder="Home WiFi password" autocomplete="off" autocapitalize="off" autocorrect="off">
    <button id="wsave">Save WiFi to the lights</button>
    <button id="wclear">Forget saved WiFi</button>
    <button id="updbtn">Start update mode</button>
    <div id="updmsg"></div>
  </div>

  <div class="card"><h2>Presets</h2><div class="grid" id="pre"></div></div>
</div>

<script>
const SERVICE="6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX="6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const ST="6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const MODES=["Solid","Breathe","Flash","Rainbow","Colour fade","Chase","Scanner","Twinkle","Fire","Red-Blue"];
const PRESETS=["Commuter","Be seen","Party","Chill"];
const SWATCH=["#ffffff","#ff0000","#ff7a00","#ffd000","#00ff40","#00e5ff","#2060ff","#b000ff","#ff00a0"];
const $=id=>document.getElementById(id);
let dev=null,rx=null,st=null,S=null,T=2,busy=false,pend=null,sigTimer=null;
const enc=new TextEncoder(),dec=new TextDecoder(),sleep=ms=>new Promise(r=>setTimeout(r,ms));

function status(t,err){$('status').textContent=t;$('status').className=err?'err':'';}
function cur(){return S.l[T===2?0:T];}
function paint(){
  if(!S)return;
  const L=cur();
  $('col').value='#'+L.c;$('bri').value=L.b;$('spd').value=L.s;
  [...$('modes').children].forEach((b,i)=>b.classList.toggle('on',i===L.m));
  $('pwr').classList.toggle('on',!!S.p);$('pwr').textContent=S.p?'ON':'OFF';
  [1,2,3].forEach(v=>$('sg'+v).classList.toggle('on',S.g===v));
  const bt=$('batt');
  if(typeof S.bp==='number'&&S.bp>=0){
    bt.textContent='Battery '+S.bp+'%';
    bt.style.color=S.bp>50?'var(--ok)':S.bp>20?'#e0a000':'var(--err)';
  }else if(S.bp===-1){bt.textContent='USB power';bt.style.color='var(--muted)';}
  else bt.textContent='';
  $('upd').style.display=('u' in S)?'block':'none';
  if('u' in S){
    $('wsaved').textContent=S.wn?'Saved WiFi: '+S.wn:'No WiFi saved yet';
    $('updbtn').textContent=(S.u===1||S.u===2)?'Stop update mode':'Start update mode';
    $('updbtn').classList.toggle('on',S.u===1||S.u===2);
    $('updmsg').textContent=
      S.u===1?'Joining the WiFi...':
      S.u===2?'Ready. In the Arduino IDE pick the network port "bikelights" and upload as normal, or open http://'+S.ip+'/update on a computer on the same WiFi. It switches off by itself after 10 minutes.':
      S.u===3?'Could not join the WiFi - check the WiFi name and password you saved above (2.4 GHz WiFi only).':
      S.u===4?'Type your home WiFi name and password above and tap Save WiFi first.':
      'Turns on WiFi for a few minutes so you can update the lights without a cable. Do this when the bike is parked.';
  }
  $('layout').style.display=S.w?'block':'none';
  if(S.w){
    $('swf').textContent='Front: top row = '+(S.w[0]?'LEFT':'RIGHT');
    $('swb').textContent='Back: left column = '+(S.w[1]?'RIGHT':'LEFT');
  }
  $('auto').style.display=(S.i===0)?'none':'block';
  $('auto').classList.toggle('on',!!S.a);$('auto').textContent='Wired turn sensor: '+(S.a?'ON':'OFF');
  if('t' in S)$('sens').value=S.t;
  $('imumsg').textContent=(S.i===0)?'No wired turn sensor in the hub - the phone option above does the same job.':'';
}
let chain=Promise.resolve();
function gatt(fn){const p=chain.then(fn);chain=p.catch(()=>{});return p;}
function write(cmd){return gatt(()=>rx.writeValue(enc.encode(cmd)));}
async function readState(){
  const v=await gatt(()=>st.readValue());
  S=JSON.parse(dec.decode(v));paint();
}
// slider/colour/mode changes: one short command per value, latest value wins
function send(p){
  if(!S||!rx)return;
  for(const i of (T===2?[0,1]:[T])){
    const L=S.l[i];
    if('m' in p)L.m=p.m;if('c' in p)L.c=p.c;if('b' in p)L.b=p.b;if('s' in p)L.s=p.s;
  }
  pend=Object.assign(pend||{},p);
  if(!busy)flush();
}
async function flush(){
  busy=true;
  try{
    while(pend){
      const p=pend;pend=null;
      for(const k of Object.keys(p))await write('l='+T+' '+k+'='+p[k]);
    }
  }catch(e){status('Send failed - check the connection',true);}
  busy=false;
}
async function action(cmd){
  if(!rx)return;
  try{await write(cmd);await sleep(200);await readState();}
  catch(e){status('Send failed - check the connection',true);}
}

async function link(){
  status('Connecting...');
  const srv=await dev.gatt.connect();
  const svc=await srv.getPrimaryService(SERVICE);
  rx=await svc.getCharacteristic(RX);
  st=await svc.getCharacteristic(ST);
  await readState();
  $('ctl').style.display='block';
  $('conn').textContent='Connected - tap to switch device';$('conn').classList.remove('on');
  status('Connected to '+(dev.name||'BikeLights'));
}
async function drop(){
  rx=null;st=null;
  for(let i=0;i<5&&dev&&!dev.gatt.connected;i++){
    status('Connection lost - reconnecting...',true);
    await sleep(1500);
    try{await link();return;}catch(e){}
  }
  if(!dev.gatt.connected){status('Disconnected - tap Connect',true);$('conn').textContent='Connect to BikeLights';$('conn').classList.add('on');}
}
// refresh battery %, indicator and update state every 4 seconds while connected
setInterval(async()=>{
  if(!rx||!st||!S||busy)return;
  try{
    const v=await gatt(()=>st.readValue());
    const j=JSON.parse(dec.decode(v));
    Object.assign(S,{p:j.p,g:j.g,bp:j.bp,bv:j.bv,u:j.u,ip:j.ip,wn:j.wn});paint();
  }catch(e){}
},4000);
$('conn').onclick=async()=>{
  if(!navigator.bluetooth){status('This browser has no Bluetooth support. Use Chrome on Android, or the Bluefy app on iPhone.',true);return;}
  try{
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}]});
    dev.addEventListener('gattserverdisconnected',drop);
    await link();
  }catch(e){status(e.name==='NotFoundError'?'No device chosen':'Could not connect: '+e.message,true);}
};

MODES.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{send({m:i});paint();};$('modes').appendChild(b);});
PRESETS.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>action('pre='+i);$('pre').appendChild(b);});
SWATCH.forEach(c=>{const s=document.createElement('span');s.style.background=c;s.onclick=()=>{$('col').value=c;send({c:c.slice(1)});};$('sw').appendChild(s);});
[...$('tabs').children].forEach(b=>b.onclick=()=>{T=+b.dataset.t;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));paint();});
$('col').oninput=e=>send({c:e.target.value.slice(1)});
$('bri').oninput=e=>send({b:+e.target.value});
$('spd').oninput=e=>send({s:+e.target.value});
// ----- turn detection with the phone's motion sensors -----
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let phoneOn=false,pFlip=false,yaw=0,calmSince=0,phoneSig=0,pStart=0,pSent=0,lastShow=0,gotMotion=false,lastT=0,theta=0,refractUntil=0;
let calState=0,calStart=0,calN=0,calAcc=[0,0,0],calGyr=[0,0,0],calUp=null,calBias=null;
let win=[],winSum=0;
try{pFlip=localStorage.getItem('flip')==='1';}catch(e){}
function showFlip(){$('flip').textContent='Left/right swapped: '+(pFlip?'YES':'NO');$('flip').classList.toggle('on',pFlip);}
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(phoneOn&&document.visibilityState==='visible')wake();});
function setSig(m){
  phoneSig=m;pSent=performance.now();
  if(S){S.g=m;paint();}
  if(rx)write('sg='+m).catch(()=>{});
}
// angle turned (degrees) over the last 1.5 s is added up, so bumps and wobble cancel out
function addWin(now,d){win.push([now,d]);winSum+=d;while(win.length&&now-win[0][0]>1500)winSum-=win.shift()[1];}
function winAngle(now,ms){let s=0;for(let i=win.length-1;i>=0&&now-win[i][0]<=ms;i--)s+=win[i][1];return s;}
function startAngle(){return 40-0.3*(+$('sens').value);}   // sensitivity 1 = 40 deg, 100 = 10 deg in 1.5 s

// ----- "last turn" line -----
let showPeak=false,tOn=false,tArm=0,tPeak=0,tPeakA=0,tDir=0,tStart=0,tAngle=0,tCalm=0,tTrig=false,lastTurn=null;
try{showPeak=localStorage.getItem('peak')==='1';}catch(e){}
function showTurn(){
  $('peakbtn').textContent='Show last turn details: '+(showPeak?'ON':'OFF');
  $('peakbtn').classList.toggle('on',showPeak);
  if(!showPeak){$('peak').textContent='';return;}
  if(!lastTurn){$('peak').textContent='Last turn: none yet';return;}
  const t=lastTurn;
  $('peak').textContent='Last turn: '+(t.dir===1?'left':'right')+', peak '+t.peak.toFixed(0)+' deg/s, '
    +t.secs.toFixed(1)+' s, '+t.deg.toFixed(0)+' deg turned - '
    +(t.trig?'indicator came on':'indicator did not come on (needed '+t.thr.toFixed(0)+' deg in 1.5 s, best was '+t.ang.toFixed(0)+')');
}
function trackTurn(now,dt){
  const ay=Math.abs(yaw);
  if(!tOn){
    if(ay>6){if(!tArm)tArm=now;if(now-tArm>300){tOn=true;tStart=tArm;tPeak=ay;tPeakA=Math.abs(winSum);tDir=yaw>0?1:2;tAngle=0;tCalm=0;tTrig=false;}}
    else tArm=0;
  }
  if(tOn){
    tAngle+=yaw*dt;
    if(ay>tPeak){tPeak=ay;tDir=yaw>0?1:2;}
    tPeakA=Math.max(tPeakA,Math.abs(winSum));
    if(phoneSig)tTrig=true;
    if(ay<4){
      if(!tCalm)tCalm=now;
      if(now-tCalm>1000){
        lastTurn={peak:tPeak,dir:tDir,secs:(now-1000-tStart)/1000,deg:Math.abs(tAngle),trig:tTrig,thr:startAngle(),ang:tPeakA};
        tOn=false;tArm=0;showTurn();
      }
    }else tCalm=0;
  }
}
$('peakbtn').onclick=()=>{showPeak=!showPeak;try{localStorage.setItem('peak',showPeak?'1':'0');}catch(e){}showTurn();};
showTurn();

// ----- calibration: bike upright and still for 3 seconds -----
function startCal(){calState=1;calStart=0;calN=0;calAcc=[0,0,0];calGyr=[0,0,0];if(phoneSig)setSig(0);}
function calibrate(now,acc,r){
  if(!calStart)calStart=now;
  const gm=Math.hypot(r.beta,r.gamma,r.alpha);
  const mean=calN?calAcc.map(v=>v/calN):acc;
  const dev=Math.hypot(acc[0]-mean[0],acc[1]-mean[1],acc[2]-mean[2]);
  if(gm>10||dev>1.5){calStart=now;calN=0;calAcc=[0,0,0];calGyr=[0,0,0];$('rate').textContent='Calibrating... the phone moved, keep the bike still';return;}
  calN++;for(let k=0;k<3;k++)calAcc[k]+=acc[k];
  calGyr[0]+=r.beta;calGyr[1]+=r.gamma;calGyr[2]+=r.alpha;
  $('rate').textContent='Calibrating... keep the bike upright and still ('+Math.ceil(Math.max(0,3-(now-calStart)/1000))+')';
  if(now-calStart>=3000&&calN>50){
    const m=calAcc.map(v=>v/calN),mag=Math.hypot(m[0],m[1],m[2]);
    if(mag<5){calStart=0;calN=0;calAcc=[0,0,0];calGyr=[0,0,0];$('rate').textContent='Calibration failed - could not feel gravity, trying again';return;}
    calUp=m.map(v=>(IOS?-1:1)*v/mag);
    calBias=[calGyr[0]/calN,calGyr[1]/calN,calGyr[2]/calN];
    calState=2;win=[];winSum=0;yaw=0;lastT=0;refractUntil=now+1000;
    $('rate').textContent='Calibrated. Ready.';
  }
}

// ----- decide when to switch the indicator on and off -----
function detect(now,dt,w){
  const startA=startAngle(),stopA=startA*0.25;
  if(!phoneSig){
    if(S.g!==0||now<refractUntil)return;
    if(Math.abs(winSum)>startA){pStart=now;calmSince=0;theta=0;setSig(winSum>0?1:2);}
  }else{
    const sgn=phoneSig===1?1:-1;
    theta+=sgn*w*dt;                                   // degrees turned the way we indicated
    if(now-pSent>12000)setSig(phoneSig);
    if(sgn*winAngle(now,800)<stopA){if(!calmSince)calmSince=now;}else calmSince=0;
    const calmFor=calmSince?now-calmSince:0,on=now-pStart;
    // off when the turn is over (turned enough and steady again), or steady for a long time, or far too long
    if((on>3000&&calmFor>700&&(theta>30||calmFor>3000))||on>20000){
      refractUntil=now+2500;calmSince=0;setSig(0);   // ignore the straightening-up wobble for a moment
    }
  }
}

function onMotion(e){
  const r=e.rotationRate,a=e.accelerationIncludingGravity;
  if(!r||!a||r.alpha==null||a.x==null)return;
  gotMotion=true;
  const now=performance.now();
  const dt=lastT?Math.min((now-lastT)/1000,0.1):0.016;lastT=now;
  if(calState===1){calibrate(now,[a.x,a.y,a.z],r);return;}
  if(calState!==2)return;
  // turn rate around the bike's upright direction (found during calibration), + = turning left
  let w=(r.beta-calBias[0])*calUp[0]+(r.gamma-calBias[1])*calUp[1]+(r.alpha-calBias[2])*calUp[2];
  if(pFlip)w=-w;
  yaw+=0.15*(w-yaw);
  addWin(now,w*dt);
  if(now-lastShow>200){
    lastShow=now;
    $('rate').textContent='Turn rate: '+yaw.toFixed(0)+' deg/s ('+(yaw>8?'left':yaw<-8?'right':'straight')+') | last 1.5 s: '+winSum.toFixed(0)+' deg'
      +(phoneSig?' | indicator '+(phoneSig===1?'LEFT':'RIGHT'):'');
  }
  trackTurn(now,dt);
  if(!S||!rx)return;
  detect(now,dt,w);
}
$('cal').onclick=()=>{if(phoneOn)startCal();};
$('phone').onclick=async()=>{
  if(phoneOn){
    phoneOn=false;window.removeEventListener('devicemotion',onMotion);
    if(phoneSig)setSig(0);
    calState=0;$('cal').style.display='none';$('rate').textContent='';
    $('phone').classList.remove('on');$('phone').textContent='Detect turns with this phone: OFF';return;
  }
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      const res=await DeviceMotionEvent.requestPermission();
      if(res!=='granted'){$('rate').textContent='Motion access was not allowed';return;}
    }
  }catch(e){$('rate').textContent='Could not get motion access: '+e.message;return;}
  phoneOn=true;gotMotion=false;startCal();
  window.addEventListener('devicemotion',onMotion);wake();
  $('phone').classList.add('on');$('phone').textContent='Detect turns with this phone: ON';
  $('cal').style.display='block';
  $('rate').textContent='Starting...';
  setTimeout(()=>{if(phoneOn&&!gotMotion)$('rate').textContent='No motion data from this browser';},2500);
};
$('flip').onclick=()=>{pFlip=!pFlip;try{localStorage.setItem('flip',pFlip?'1':'0');}catch(e){}showFlip();};
showFlip();
// WiFi name / password are sent in small pieces so every message is short
function pieces(s){
  const out=[];let cur='',len=0;
  for(const ch of s){const l=enc.encode(ch).length;if(len+l>14){out.push(cur);cur='';len=0;}cur+=ch;len+=l;}
  if(cur||!out.length)out.push(cur);
  return out;
}
$('wsave').onclick=async()=>{
  if(!S||!rx)return;
  const ssid=$('wssid').value,pass=$('wpass').value;
  if(!ssid){$('updmsg').textContent='Type your WiFi name first.';return;}
  try{
    const a=pieces(ssid);for(let i=0;i<a.length;i++)await write((i?'n1=':'n0=')+a[i]);
    const b=pieces(pass);for(let i=0;i<b.length;i++)await write((i?'p1=':'p0=')+b[i]);
    await write('wsave=1');await sleep(250);await readState();
    $('wpass').value='';$('wssid').value='';
    $('updmsg').textContent='WiFi saved on the lights. Now tap Start update mode when you want to update.';
  }catch(e){$('updmsg').textContent='Could not save the WiFi - check the Bluetooth connection.';}
};
$('wclear').onclick=()=>{if(S&&('u' in S))action('wclr=1');};
$('updbtn').onclick=()=>{if(S&&('u' in S))action('up='+((S.u===1||S.u===2)?0:1));};
$('swf').onclick=()=>{if(S&&S.w)action('fs='+(S.w[0]?0:1));};
$('swb').onclick=()=>{if(S&&S.w)action('bs='+(S.w[1]?0:1));};
$('auto').onclick=()=>{if(S)action('at='+(S.a?0:1));};
$('sens').oninput=e=>send({ts:+e.target.value});
$('pwr').onclick=()=>{if(S)action('pw='+(S.p?0:1));};
[1,2,3].forEach(v=>$('sg'+v).onclick=()=>{
  if(!S)return;
  phoneSig=0;
  const m=S.g===v?0:v;S.g=m;paint();
  clearTimeout(sigTimer);if(m)sigTimer=setTimeout(()=>{S.g=0;paint();},20000);
  action('sg='+m);
});
</script>
</body>
</html>
